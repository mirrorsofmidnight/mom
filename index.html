<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Mirrors of Midnight</title>
  <link rel="icon" type="image/png" href="assets/Logo.png">
  <style>
    @font-face {
      font-family: 'Vamp';
      src: url('assets/Fonts/Vampire Zone.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Happy';
      src: url('assets/Fonts/HappyHalloween.ttf') format('truetype');
    }

    :root {
      --title: "Vamp", sans-serif;
      --body: "Happy", sans-serif;
      --night: #120e2b;
      --plum: #2a1d5e;
      --lilac: #b9a6ff;
      --butter: #ffd76a;
      --mist: #efeaff;
      --blue: #2152e0;
      --indigo: #4a35d6;
      --gold: #f7b928;
      --cream: #fff3c8;
      --mw: min(550px, 85vw);
      --mh: 66dvh;
      --knob-shift: 5dvh;
      --bg-phone: url("assets/Backgrounds/BG 1 Verti.png");
      --bg-desktop: url("assets/Backgrounds/BG 1 Horti 169.png");
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      overscroll-behavior: none;
      margin: 0;
      min-height: 100dvh;
      font-family: var(--body);
      font-weight: 500;
      line-height: 1.55;
      color: var(--mist);
      background-color: var(--night);
    }

    body.is-home {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      height: 100lvh;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image: var(--bg-phone);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: transform .5s ease-in;
    }

    button, a {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--butter);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .stars i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s ease-in-out infinite;
    }

    @keyframes tw {
      50% {
        opacity: .15;
        transform: scale(.6);
      }
    }

    .logo {
      position: fixed;
      left: 14px;
      top: calc(10px + env(safe-area-inset-top, 0px));
      z-index: 30;
      display: block;
      font-family: var(--title);
      font-size: 20px;
      color: var(--butter);
      text-decoration: none;
    }

    .logo img {
      display: block;
      height: clamp(60px, 12vw, 100px);
      width: auto;
      transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
    }

    .logo:hover img,
    .logo:active img {
      transform: rotate(-8deg) scale(1.1);
    }

    .bar {
      position: fixed;
      right: 14px;
      top: calc(10px + env(safe-area-inset-top, 0px));
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .sound {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      border-radius: 50%;
      border: 2px solid var(--butter);
      background: rgba(18, 14, 43, .6);
      cursor: pointer;
    }

    .mirror {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: var(--mw);
      height: var(--mh);
      transform: translateX(-50%);
      border: 4px solid var(--butter);
      border-bottom: 0;
      border-radius: 15px 15px 0 0;
      background: linear-gradient(170deg, rgba(185, 166, 255, .70), rgba(42, 29, 94, .60) 60%);
      box-shadow: 0 0 0 6px rgba(170, 130, 255, .4), inset 0 0 60px rgba(185, 166, 255, .35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: clamp(16px, 3dvh, 32px);
      padding: 4dvh 22px calc(6dvh + env(safe-area-inset-bottom, 0px));
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      transform-origin: left center;
      transition: transform .9s cubic-bezier(.5, 0, .3, 1), opacity .5s ease-in;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .opening .mirror {
      transform: translateX(-50%) perspective(900px) rotateY(-100deg);
    }

    .opening .knob {
      opacity: 0;
      transition: opacity .3s;
    }

    .going .mirror {
      opacity: 0;
    }

    .mirror::before,
    .mirror::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .14) 50%, transparent 58%);
      background-size: 300% 100%;
      background-repeat: no-repeat;
      animation: glint 6s linear infinite;
    }

    .mirror::after {
      animation-delay: -3s;
    }

    @keyframes glint {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: 0% 0;
      }
    }

    h1 {
      position: relative;
      margin: 0;
      font-family: var(--title);
      font-weight: 200;
      font-size: clamp(28px, 6vw, 46px);
      line-height: 1;
      color: var(--butter);
      -webkit-text-stroke: 4px #162e9c;
      paint-order: stroke fill;
      text-shadow: 0 5px 0 #1a3a8f;
    }

    h1 .ch {
      display: inline-block;
      transition: transform .25s cubic-bezier(.3, 1.8, .5, 1);
    }

    h1 .ch:active {
      transform: translateY(-10px) rotate(-8deg);
    }

    @media (hover: hover) {
      h1 .ch:hover {
        transform: translateY(-10px) rotate(-8deg);
      }
    }

    h1 .word {
      display: inline-block;
      white-space: nowrap;
    }

    .lead {
      position: relative;
      max-width: 34ch;
      margin: 0 auto;
      font-size: 16px;
      color: #d8d0ff;
      white-space: pre-line;
    }

    @media (min-width: 700px) {
      .lead {
        font-size: 17px;
      }
    }

    .knob {
      position: fixed;
      z-index: 20;
      top: calc(96dvh - var(--mh) / 2 + var(--knob-shift));
      left: calc(50% + var(--mw) / 2);
      width: clamp(46px, 12vw, 72px);
      aspect-ratio: 1;
      translate: calc(-100% - 12px) -50%;
      transition: scale .3s cubic-bezier(.3, 1.8, .5, 1);
      --glow: #ff4fa3;
      animation: knobglow 2s ease-in-out infinite;
    }

    .knob:active {
      scale: 1.2;
    }

    @media (hover: hover) {
      .knob:hover {
        scale: 1.12;
      }
    }

    .knob img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .4));
      transition: opacity .6s;
    }

    .knob img.on {
      opacity: 1;
    }

    @keyframes knobglow {
      0%, 100% {
        filter: drop-shadow(0 0 4px var(--glow)) brightness(.95);
      }
      50% {
        filter: drop-shadow(0 0 22px var(--glow)) brightness(1.2);
      }
    }

    .veil {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: var(--night);
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease-out;
    }

    .mirror > h1,
    .mirror > .lead,
    #pages > * {
      transition: opacity .45s ease-in, transform .45s ease-in;
    }

    .going::before {
      transform: scale(1.3);
    }

    .going .veil {
      opacity: 1;
      transition: opacity .5s ease-in;
    }

    .going .mirror > *,
    .going #pages > * {
      opacity: 0;
      transform: scale(1.12);
    }

    .enter::before {
      animation: roomIn .9s ease-out both;
    }

    .enter .mirror > *,
    .enter #pages > * {
      animation: contentIn .8s ease-out both;
    }

    @keyframes roomIn {
      from {
        transform: scale(1.2);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: scale(.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .turn-in #pages > * {
      animation: pin .5s cubic-bezier(.2, .9, .3, 1.1) both;
    }

    @keyframes pin {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
    }

    body:not(.is-home) .mirror,
    body:not(.is-home) .knob {
      display: none;
    }

    .is-home #pages {
      display: none;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 130px 20px 140px;
    }

    h2.pt {
      margin: 0;
      line-height: 0;
    }

    h2.pt img {
      display: block;
      height: clamp(60px, 14vw, 110px);
      width: auto;
      max-width: 100%;
      filter: drop-shadow(0 5px 0 rgba(26, 58, 143, .8));
    }

    .sub {
      max-width: 50ch;
      margin: 14px 0 0;
      font-size: 17px;
      color: #d8d0ff;
    }

    .card {
      border-radius: 26px;
      background: var(--mist);
      color: var(--night);
      box-shadow: 0 6px 0 var(--plum), 0 18px 30px rgba(0, 0, 0, .35);
    }

    .foot {
      margin: 50px 0 0;
      font-size: 12px;
      color: var(--butter);
      opacity: .8;
    }

    .kb {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--c, #aa82ff);
      box-shadow: inset -3px -4px 7px rgba(18, 14, 43, .4), inset 3px 3px 5px rgba(255, 255, 255, .5);
    }

    .kb.img {
      background: none;
      box-shadow: none;
      filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .4));
    }

    .kb.key {
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, .9)) drop-shadow(0 0 14px rgba(255, 255, 255, .5));
    }

    .kb.img i {
      display: none;
    }

    .kb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .ai {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .rules {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 34px;
    }

    .rule {
      padding: 0;
      text-align: left;
      border: 0;
      width: 100%;
      cursor: pointer;
    }

    .rh {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
    }

    .rn {
      position: relative;
      flex: none;
      width: 50px;
      height: 50px;
    }

    .rh h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .rh p {
      margin: 2px 0 0;
      font-size: 14px;
      opacity: .75;
    }

    .rh .ar {
      margin-left: auto;
      font-size: 22px;
      font-weight: 800;
      transition: transform .3s;
    }

    .rule.open .ar {
      transform: rotate(45deg);
    }

    .more {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .35s ease;
    }

    .rule.open .more {
      grid-template-rows: 1fr;
    }

    .more > div {
      overflow: hidden;
    }

    .more p {
      margin: 0 18px 16px;
      padding-top: 12px;
      border-top: 2px dashed rgba(18, 14, 43, .25);
      font-size: 15px;
    }

    .line {
      position: relative;
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
    }

    .line::before {
      content: "";
      position: absolute;
      left: 34px;
      top: 30px;
      bottom: 30px;
      border-left: 3px dashed rgba(255, 255, 255, .55);
    }

    .st {
      position: relative;
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 26px;
    }

    .st .bt {
      display: block;
      width: 68px;
      height: 68px;
      transition: transform .5s cubic-bezier(.3, 1.8, .5, 1);
    }

    .st:hover .bt {
      transform: rotate(-15deg) scale(1.1);
    }

    .st .card {
      padding: 16px 20px;
    }

    .st h3 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }

    .st p {
      margin: 0;
      font-size: 15px;
    }

    .st p a {
      color: #006ee9;
      font-weight: 800;
      text-decoration: none;
    }

    .st p a b {
      color: inherit;
    }

    .st p a:hover {
      color: #6f6bf3;
    }

    .door {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 30px;
      border: 0;
      border-radius: 999px;
      background: var(--butter);
      color: var(--night);
      font-size: 19px;
      font-weight: 800;
      box-shadow: 0 6px 0 #c9962a, 0 14px 24px rgba(0, 0, 0, .35);
      transition: transform .15s, box-shadow .15s;
      text-decoration: none;
    }

    .door:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #c9962a, 0 18px 28px rgba(0, 0, 0, .35);
    }

    .door:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c9962a;
    }

    .door svg {
      width: 24px;
      height: 24px;
    }

    .admins {
      display: grid;
      grid-template-columns: 1fr;
      gap: 46px;
      margin-top: 56px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(18, 14, 43, .78);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mcard {
      position: relative;
      width: min(440px, 100%);
      max-height: 85dvh;
      overflow-y: auto;
      padding: 14px 14px 18px;
      text-align: center;
      transform: scale(.9) translateY(20px);
      transition: transform .4s cubic-bezier(.3, 1.5, .5, 1);
    }

    .modal.open .mcard {
      transform: none;
    }

    .mx {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--butter);
      color: var(--night);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 0 #c9962a;
    }

    .mcard .ph {
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      margin: 0 auto 10px;
      border: 0;
      border-radius: 0;
      overflow: visible;
      background: none;
      box-shadow: none;
    }

    .mcard .ph img {
      position: static;
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 0;
    }

    .mcard .ph .in {
      position: static;
      width: 100px;
      height: 100px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(160deg, var(--lilac), var(--plum));
    }

    .mcard .mn,
    .mcard .sts,
    .mcard .tdy,
    .mcard .bio {
      margin-left: 12px;
      margin-right: 12px;
    }

    .mcard .mn {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .mcard .sts {
      margin: 8px auto 0;
    }

    .mcard .bio {
      margin: 16px 0 0;
      font-size: 15px;
      line-height: 1.55;
      text-align: left;
    }

    .mcard .tdy {
      margin: 16px 0 0;
      font-size: 14px;
    }

    .ad {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 180px;
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
      transition: translate .3s cubic-bezier(.3, 1.7, .5, 1);
    }

    .ad:hover {
      translate: 0 -6px;
    }

    .ad:nth-child(1) {
      justify-self: start;
      rotate: -2deg;
    }

    .ad:nth-child(2) {
      justify-self: center;
      rotate: 1.5deg;
    }

    .ad:nth-child(3) {
      justify-self: end;
      rotate: -1.5deg;
    }

    .ad .face:not(.ph) {
      top: 14px;
    }

    .ad .face {
      display: grid;
      grid-template-columns: 90px 1fr;
      grid-auto-rows: min-content;
      align-content: center;
      column-gap: 16px;
      row-gap: 3px;
      padding: 18px 20px;
      background: linear-gradient(160deg, #fff 0%, var(--mist) 55%, #ddd3ff 100%);
    }

    .ad .face::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(42, 29, 94, .28);
      border-radius: 20px;
      pointer-events: none;
    }

    .ad .face > * {
      grid-column: 2;
      position: relative;
    }

    .ph {
      grid-column: 1 !important;
      grid-row: 1 / span 4;
      justify-self: center;
      align-self: center;
      position: relative;
      flex: none;
      width: 100px;
      height: 100px;
      aspect-ratio: 1 / 1;
      margin: 0;
      overflow: hidden;
      border: 4px solid var(--butter);
      border-radius: 50%;
      background: linear-gradient(160deg, var(--lilac), var(--plum));
      box-shadow: 0 0 0 3px var(--plum), 0 8px 14px rgba(18, 14, 43, .35), inset 0 0 18px rgba(255, 255, 255, .35);
    }

    .ad .face .ph {
      grid-column: auto !important;
      grid-row: auto !important;
      position: absolute;
      left: 20px;
      top: 50%;
      translate: 0 -50%;
      width: 90px;
      height: auto;
      aspect-ratio: 3 / 4;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 6px 12px rgba(18, 14, 43, .25);
    }

    .ad .face .ph .in {
      border-radius: 0;
      font-size: 40px;
    }

    .ad .face .ph img {
      object-position: center 20%;
    }

    .ph img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0;
    }

    .ph .in {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--title);
      font-size: 44px;
      color: rgba(255, 255, 255, .9);
      border-radius: 50%;
    }

    .ad h3 {
      margin: 10px 0 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }

    .ad .sts {
      margin-top: 8px;
      justify-self: start;
      margin: 2px 0 0;
    }

    .ad .tp {
      margin: 6px 0 0;
      font-size: 11px;
    }

    .sts {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      align-self: center;
      margin: 6px 0 0;
      padding: 3px 9px;
      border-radius: 999px;
      background: #fff;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 2px 0 var(--plum);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9a96ad;
    }

    .sts.on .dot {
      background: #2fb46a;
      animation: ping 1.6s infinite;
    }

    @keyframes ping {
      to {
        box-shadow: 0 0 0 9px rgba(47, 180, 106, 0);
      }
    }

    .tp {
      margin: auto 0 0;
      font-size: 12px;
      font-weight: 700;
      opacity: .55;
    }

    .bio {
      margin: 4px 0 0;
      font-size: 12px;
      line-height: 1.4;
    }

    .tdy {
      margin: 8px 0 0;
      font-size: 13px;
      font-weight: 800;
    }

    .dock {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 30;
      display: none;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(18, 14, 43, .82);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 0 2px rgba(185, 166, 255, .4), 0 10px 24px rgba(0, 0, 0, .4);
      transform: translateX(-50%);
    }

    body:not(.is-home) .dock {
      display: flex;
    }

    .dk {
      position: relative;
      display: block;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      transition: transform .25s cubic-bezier(.3, 1.7, .5, 1);
    }

    .dk:hover {
      transform: translateY(-6px) rotate(25deg) scale(1.1);
    }

    .dk.cur {
      transform: translateY(-6px) scale(1.15);

    function parseCSV(s) {
      const rows = [];
      let r = [], c = "", q = false;

      for (let i = 0; i < s.length; i++) {
        const ch = s[i];

        if (q) {
          if (ch === '"' && s[i + 1] === '"') {
            c += '"';
            i++;
          } else if (ch === '"') {
            q = false;
          } else {
            c += ch;
          }
        } else if (ch === '"') {
          q = true;
        } else if (ch === ",") {
          r.push(c);
          c = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && s[i + 1] === "\n") i++;
          r.push(c);
          rows.push(r);
          r = [];
          c = "";
        } else {
          c += ch;
        }
      }

      if (c || r.length) {
        r.push(c);
        rows.push(r);
      }
      return rows;
    }

      parseCSV(text.trim()).slice(1).forEach(r => {
        const name = (r[0] || "").trim();

            ok: s.ok,
            no: s.no
          };
        }
      });
      return map;
    }

        root.classList.add("result");
      });

      q(".again").addEventListener("click", () => {
        root.classList.remove("result");
        inp.value = "";
        paint();
        setTimeout(() => inp.focus({ preventScroll: true }), 500);
      });

      paint();
      return root;
    }

    function buildPage() {
      const h = $("pages");
      h.textContent = "";
      h.append({
        about: pgAbout,
        rules: pgRules,
        join: pgJoin,
        caretaker: pgCare,
        trick: trickLocked() ? pgComingSoon : pgTrick
      }[page](C[lang], U[lang]));
    }

    function buildDock() {
      const d = $("dock");
      d.textContent = "";
      ORDER.slice(1).forEach((id, i) => {
        const a = el("a", "dk" + (id === page ? " cur" : ""));
        a.href = href(id);
        a.setAttribute("aria-label", LABELS[lang][id]);
        a.append(dockIcon(id, i), T("span", "tipx", LABELS[lang][id]));
        d.append(a);
      });
    }

    function draw() {
      closeCare();
      const isHome = page === "home";
      const L = isHome ? "en" : lang;
      document.body.classList.toggle("is-home", isHome);
      document.body.classList.toggle("is-trick", page === "trick" && !trickLocked());
      clearInterval(tmr);
      if (isHome) {
        const c = PAGES.home.en;
        renderTitleImg(HOME_TITLE_IMG, c.title);
        $("lead").textContent = c.lead;
      } else {
        buildPage();
      }
      buildDock();
      if (lastPage !== page) {
        scrollTo(0, 0);
        lastPage = page;
      }
      document.title = (isHome ? "" : LABELS[L][page] + " · ") + SITE;
      document.documentElement.lang = L;

      const next = ORDER[(ORDER.indexOf(page) + 1) % ORDER.length];
      $("knob").href = href(next);
      $("knob").setAttribute("aria-label", LABELS[L][next]);
    }

    function routeFromHash() {
      const s = location.hash.slice(1);
      return ORDER.find(id => SLUGS[id] === s || id === s) || "home";
    }

    let busy = null;
    let enterT = null;

    function go() {
      const target = routeFromHash();
      if (target === page && $("title").childNodes.length) return;
      if (reduce) {
        page = target;
        draw();
        return;
      }

      const body = document.body;
      const inner = page !== "home" && target !== "home";

      const swap = () => {
        page = target;
        draw();
        body.classList.remove("going", "opening");
        body.classList.add("enter");
        clearTimeout(enterT);
        enterT = setTimeout(() => body.classList.remove("enter"), 900);
      };

      if (inner) {
        clearTimeout(busy);
        clearTimeout(enterT);
        body.classList.remove("turn-in", "going", "opening", "enter", "zoom-in");
        body.classList.add("zoom-out");
        busy = setTimeout(() => {
          page = target;
          draw();
          body.classList.remove("zoom-out");
          body.classList.add("zoom-in");
          enterT = setTimeout(() => body.classList.remove("zoom-in"), 650);
        }, 350);
        return;
      }

      clearTimeout(busy);

      if (page === "home") {
        body.classList.add("opening");
        busy = setTimeout(() => {
          body.classList.add("going");
          busy = setTimeout(swap, 600);
        }, 600);
      } else {
        body.classList.add("going");
        busy = setTimeout(swap, 500);
      }
    }

    addEventListener("hashchange", go);

    document.addEventListener("contextmenu", e => {
      if (!e.target.closest("input, textarea")) e.preventDefault();
    });

    document.addEventListener("dragstart", e => e.preventDefault());

    const bgm = $("bgm");
    bgm.volume = 0.4;

    let muted = false;
    try {
      muted = localStorage.getItem("muted") === "1";
    } catch (e) {}

    function updateSoundBtn() {
      $("sound").textContent = muted ? "🔇" : "🔊";
      $("sound").setAttribute("aria-pressed", String(muted));
    }

    function playBgm() {
      if (!muted) bgm.play().catch(() => {});
    }

    $("sound").addEventListener("click", e => {
      e.stopPropagation();
      muted = !muted;
      try {
        localStorage.setItem("muted", muted ? "1" : "0");
      } catch (err) {}
      if (muted) bgm.pause();
      else playBgm();
      updateSoundBtn();
    });

    updateSoundBtn();
    playBgm();
    const unlockEvents = ["pointerup", "touchend", "click", "keydown"];

    function unlockBgm() {
      if (muted) return;
      bgm.play().then(() => {
        unlockEvents.forEach(ev => removeEventListener(ev, unlockBgm));
      }).catch(() => {});
    }

    unlockEvents.forEach(ev => addEventListener(ev, unlockBgm));

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) bgm.pause();
      else playBgm();
    });

    const knobImgs = USE.knob.map(n => {
      const img = new Image();
      img.alt = "";
      img.draggable = false;
      img.src = BUTTONS[n];
      $("knob").appendChild(img);
      return img;
    });

    let currentKnob = 0;

    function showKnob(i) {
      knobImgs.forEach((img, n) => img.classList.toggle("on", n === i));
      $("knob").style.setProperty("--glow", COLORS[USE.knob[i]]);
    }

    showKnob(0);

    if (!reduce && knobImgs.length > 1) {
      setInterval(() => {
        currentKnob = (currentKnob + 1) % knobImgs.length;
        showKnob(currentKnob);
      }, 2500);
    }

    for (let i = 0; i < 60; i++) {
      const d = document.createElement("i");
      d.style.cssText =
        "left:" + Math.random() * 100 + "%;" +
        "top:" + Math.random() * 100 + "%;" +
        "animation-delay:" + Math.random() * 3 + "s;" +
        "transform:scale(" + (0.6 + Math.random()) + ")";
      $("stars").appendChild(d);
    }

    page = routeFromHash();
    draw();
  </script>
</body>

</html>
